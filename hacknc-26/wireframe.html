<!DOCTYPE html>
<html>
    <head>
        <style>
            .div1 {
                display: flex;
                gap: 20px;
                max-width: 1200px;
                margin: 0 auto 0px auto;
                padding: 10px;
            }

            .div2 {
                box-sizing: border-box;
                flex: 1;
                border: 2px solid black;
                padding: 15px;
            }
            .past-messages {
                flex: 4;
                height: 60vh
            }
            .chat
            {
                flex: 0.75;
                height: 60vh
            }
            .row2 {
                gap: 0px;
                height: 10vh;
            }
            .MessageBox {
                flex: 3;
            }
        </style>
    </head>
    <body>

        <div class="div1">
            <div class="div2 past-messages">Past Messages</div>
            <div class="div2 chat">Chats</div>
        </div>

        <div class="div1 row2">
            <div class="div2 MessageBox">Message Box</div>
            <div class="div2">Username</div>
        </div>
    </body>
</html>
